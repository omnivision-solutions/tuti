packages:
  - "apps/*"
  - "packages/*"

# Security fixes a dependency pins below. Remove each once its parent depends on the fixed version.
overrides:
  # mailauth pins joi 18.3.0 (GHSA-4528-x5fx-h6hg, fixed in 18.3.1).
  joi@18.3.0: 18.3.1

allowBuilds:
  sharp: true
  unrs-resolver: true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@hatchet-dev/typescript-sdk": false
  protobufjs: false
  cpu-features: false
  ssh2: false

minimumReleaseAgeExclude:
  - "@next/env@16.3.8"
  - "@next/eslint-plugin-next@16.3.8"
  - "@next/swc-darwin-arm64@16.3.8"
  - "@next/swc-darwin-x64@16.3.8"
  - "@next/swc-linux-arm64-gnu@16.3.8"
  - "@next/swc-linux-arm64-musl@16.3.8"
  - "@next/swc-linux-x64-gnu@16.3.8"
  - "@next/swc-linux-x64-musl@16.3.8"
  - "@next/swc-win32-arm64-msvc@16.3.8"
  - "@next/swc-win32-x64-msvc@16.3.8"
  - "@turbo/darwin-64@2.11.6"
  - "@turbo/darwin-arm64@2.11.6"
  - "@turbo/linux-64@2.11.6"
  - "@turbo/linux-arm64@2.11.6"
  - "@turbo/windows-64@2.11.6"
  - "@turbo/windows-arm64@2.11.6"
  - eslint-config-next@16.3.8
  - next@16.3.8
  - turbo@2.11.6
  - "@better-auth/core@1.7.7"
  - "@better-auth/drizzle-adapter@1.7.7"
  - "@better-auth/kysely-adapter@1.7.7"
  - "@better-auth/memory-adapter@1.7.7"
  - "@better-auth/mongo-adapter@1.7.7"
  - "@better-auth/prisma-adapter@1.7.7"
