# Sending support email with Amazon SES (docs/support-email.md, "Amazon SES"): the topic the
# configuration set's events go to (SES_EVENTS_TOPIC_ARN), subscribed by the app's /api/email/events
# (which confirms it), the user whose key the app manages tenants and identities with
# (SES_ACCESS_KEY_ID), and the SMTP user it sends with (SMTP_USERNAME). Both may act on any identity
# in the region (teams' domains can be anything), so deploy it in a region whose SES has only
# Tuti's identities: SES keeps identities, quotas and production access per region. The configuration set and the SMTP user are the
# account's own. Deployed by deploy.sh.
AWSTemplateFormatVersion: "2010-09-09"
Description: Tuti support inbox - sending with SES (events topic, API user)

Parameters:
  ConfigurationSet:
    Type: String
    Description: The configuration set support email names (SES_CONFIGURATION_SET).
  AppUrl:
    Type: String
    Default: ""
    Description: >-
      The app's origin (APP_URL), where /api/email/events is. Empty at first: the app confirms the
      subscription only once it has the SES_* settings, which come from this stack's outputs.

Conditions:
  Subscribed: !Not [!Equals [!Ref AppUrl, ""]]

Resources:
  Events:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ConfigurationSet}-events"

  EventsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Events]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ses.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref Events
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }

  EventsSubscription:
    Type: AWS::SNS::Subscription
    Condition: Subscribed
    Properties:
      TopicArn: !Ref Events
      Protocol: https
      Endpoint: !Sub "${AppUrl}/api/email/events"

  EventDestination:
    Type: AWS::SES::ConfigurationSetEventDestination
    DependsOn: EventsPolicy
    Properties:
      ConfigurationSetName: !Ref ConfigurationSet
      EventDestination:
        Name: tuti-events
        Enabled: true
        MatchingEventTypes: [send, delivery, bounce, complaint, reject]
        SnsDestination:
          TopicARN: !Ref Events

  ApiUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: tenants-and-identities
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ses:CreateTenant
                  - ses:GetTenant
                  - ses:CreateTenantResourceAssociation
                  - ses:DeleteTenantResourceAssociation
                  - ses:CreateEmailIdentity
                  - ses:GetEmailIdentity
                  - ses:DeleteEmailIdentity
                  # Teams' domains are tagged with their project when added.
                  - ses:TagResource
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:*"

  SmtpUser:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: send
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendRawEmail
                Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:*"

Outputs:
  EventsTopic:
    Value: !Ref Events
  ApiUser:
    Value: !Ref ApiUser
  SmtpUser:
    Value: !Ref SmtpUser
