name: CI

# Nightly on main too: catches what changes without a commit (base images, the
# Testcontainers Postgres image, browsers, the date) and flaky tests between PRs.
# A failed scheduled run emails whoever last changed the cron line.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event too, so a nightly run and a push to main never queue behind
  # (or replace) each other.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test

  # Split three ways, each with its own Postgres: the slowest check when it ran on one runner.
  test-db-shard:
    name: Database tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Testcontainers starts Postgres with the runner's Docker.
      - run: pnpm test:db --shard=${{ matrix.shard }}/3

  # The required check: passes only when every shard did.
  test-db:
    name: Database tests
    needs: test-db-shard
    # Always, so a cancelled run fails the check: a skipped required check counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Its own always() too: in a cancelled run a step's default success() would skip it.
      - if: ${{ always() }}
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.test-db-shard.result }}

  # The journeys split four ways by journey (fullyParallel), each on its own runner with its own
  # build and database: one runner is CPU-bound well before its tests run out. Building once for
  # all of them would make every shard wait for that build, and download it: no faster.
  e2e-shard:
    name: E2E tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Room for a slow apt mirror: installing Chromium's system packages has taken over 10 minutes on its own.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Placeholders only: the tests start the app with their own settings and database.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          APP_URL: https://tuti.example
          PORTAL_URL_TEMPLATE: https://{project}.tuti.example
          BETTER_AUTH_SECRET: ci-build-secret-at-least-32-characters-long
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14

  # The required check: passes only when every shard did.
  e2e:
    name: E2E tests
    needs: e2e-shard
    # Always, so a cancelled run fails the check: a skipped required check counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Its own always() too: in a cancelled run a step's default success() would skip it.
      - if: ${{ always() }}
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}
      # One artifact, posted on the pull request by .github/workflows/screenshots.yml.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ !cancelled() }}
        with:
          pattern: e2e-screenshots-*
          path: e2e-screenshots
          merge-multiple: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Build only (no push): proves the Dockerfile still works on every PR.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # Nightly: rebuild every layer, so package and download drift shows up.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Placeholders: auth config reads these when pages are collected.
          APP_URL: https://tuti.example
          PORTAL_URL_TEMPLATE: https://{project}.tuti.example
          BETTER_AUTH_SECRET: ci-build-secret-at-least-32-characters-long

  # Workflow security: injection, risky triggers, unpinned actions, and (online) actions with
  # known vulnerabilities, which is why it runs nightly too. A finding that is safe gets a
  # `# zizmor: ignore[<audit>] <why>` comment on its line.
  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The online audits (vulnerable or impostor actions) depend on GitHub's advisories and API,
      # not on the pull request: they'd fail unrelated pull requests. They run on pull requests
      # that change .github/, where a pin may change, and on every other event.
      - id: online
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != pull_request ]] || ! git diff --quiet "$BASE...$HEAD" -- .github; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          online-audits: ${{ steps.online.outputs.enabled }}
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false
          min-severity: medium

  # The pull request's commits, not just its diff: a key committed and then deleted stays in
  # the history. A fake key in a test gets a `gitleaks:allow` comment on its line.
  secrets:
    name: Secret scan
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          set -euo pipefail
          # The container's user doesn't own the checkout, so git needs safe.directory. When git
          # fails, gitleaks scans nothing and still passes: the log must name the commits scanned.
          docker run --rm -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts="$BASE..$HEAD" --redact --no-banner 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          grep -Eq '(^|[^0-9])[1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log" \
            || { echo "gitleaks scanned no commits." >&2; exit 1; }
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

  # A failed nightly opens one issue, or comments on it while it's open, so the
  # failure is seen by more than the cron line's last editor.
  nightly-failure:
    name: Report nightly failure
    needs: [lint, typecheck, test, test-db, e2e, docker, build, zizmor]
    # A job that hits its timeout ends "cancelled", not "failed".
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: |
          n=$(gh issue list -R "$REPO" --state open --author app/github-actions --search 'in:title "Nightly CI failed"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$REPO" --title "Nightly CI failed" --body "The nightly CI run on main failed: $RUN_URL. Later failures are added as comments. Close this once the nightly passes again."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
