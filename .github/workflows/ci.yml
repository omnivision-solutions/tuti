name: CI

# Nightly on main too: catches what changes without a commit (base images, the
# Testcontainers Postgres image, browsers, the date) and flaky tests between PRs.
# A failed scheduled run emails whoever last changed the cron line.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event too, so a nightly run and a push to main never queue behind
  # (or replace) each other.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test

  test-db:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Testcontainers starts Postgres with the runner's Docker.
      - run: pnpm test:db

  # The journeys split three ways, each on its own runner with its own build and
  # database: one runner is CPU-bound well before its tests run out.
  e2e-shard:
    name: E2E tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Placeholders only: the tests start the app with their own settings and database.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/3
        env:
          APP_URL: https://tuti.example
          PORTAL_URL_TEMPLATE: https://{project}.tuti.example
          BETTER_AUTH_SECRET: ci-build-secret-at-least-32-characters-long
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14

  # The required check: passes only when every shard did.
  e2e:
    name: E2E tests
    needs: e2e-shard
    # Always, so a cancelled run fails the check: a skipped required check counts as passed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Its own always() too: in a cancelled run a step's default success() would skip it.
      - if: ${{ always() }}
        run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}
      # One artifact, posted on the pull request by .github/workflows/screenshots.yml.
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          pattern: e2e-screenshots-*
          path: e2e-screenshots
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [web, worker]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      # Build only (no push): proves the Dockerfile still works on every PR.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          # Nightly: rebuild every layer, so package and download drift shows up.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Placeholders: auth config reads these when pages are collected.
          APP_URL: https://tuti.example
          PORTAL_URL_TEMPLATE: https://{project}.tuti.example
          BETTER_AUTH_SECRET: ci-build-secret-at-least-32-characters-long

  # A failed nightly opens one issue, or comments on it while it's open, so the
  # failure is seen by more than the cron line's last editor.
  nightly-failure:
    name: Report nightly failure
    needs: [lint, typecheck, test, test-db, e2e, docker, build]
    # A job that hits its timeout ends "cancelled", not "failed".
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - run: |
          n=$(gh issue list -R "$REPO" --state open --author app/github-actions --search 'in:title "Nightly CI failed"' --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" -R "$REPO" --body "Failed again: $RUN_URL"
          else
            gh issue create -R "$REPO" --title "Nightly CI failed" --body "The nightly CI run on main failed: $RUN_URL. Later failures are added as comments. Close this once the nightly passes again."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
