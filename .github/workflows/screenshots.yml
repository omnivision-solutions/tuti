name: Screenshots

# After CI, posts the E2E journey screenshots on the pull request.
# workflow_run has repository secrets, even for pull requests from forks: this job
# only runs code from main and treats the pull request's artifact as data
# (see scripts/publish-screenshots.sh). Skipped until storage is configured.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && vars.SCREENSHOTS_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: bash scripts/publish-screenshots.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          S3_ENDPOINT: ${{ vars.SCREENSHOTS_S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.SCREENSHOTS_BUCKET }}
          PUBLIC_BASE_URL: ${{ vars.SCREENSHOTS_PUBLIC_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCREENSHOTS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCREENSHOTS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
