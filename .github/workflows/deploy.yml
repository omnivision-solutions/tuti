name: Deploy

# After CI passes on a push to main, deploys web and worker on Coolify, then checks
# production answers on the apex and on a portal host. Never runs for pull requests
# (workflow_run would give fork code our secrets). Skipped until the COOLIFY_APPS
# variable is set; COOLIFY_URL and COOLIFY_TOKEN (deploy-only) are production environment secrets.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# One deploy at a time; a newer green main replaces a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && vars.COOLIFY_APPS != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy on Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          APPS: ${{ vars.COOLIFY_APPS }}
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$@"; }
          ids=$(api -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$APPS" | jq -r '.deployments[]?.deployment_uuid // empty')
          wanted=$(tr ',' '\n' <<<"$APPS" | grep -c .)
          started=$(grep -c . <<<"$ids" || true)
          [ "$started" = "$wanted" ] || { echo "::error::Coolify started $started of $wanted deployments"; exit 1; }
          # Both deployments share one deadline, inside the job's timeout.
          deadline=$((SECONDS + 25 * 60))
          for id in $ids; do
            while :; do
              status=$(api "$COOLIFY_URL/api/v1/deployments/$id" | jq -r .status)
              case "$status" in
                finished) echo "Deployment finished"; break ;;
                queued|in_progress) ;;
                *) echo "::error::Deployment ended as $status"; exit 1 ;;
              esac
              [ "$SECONDS" -lt "$deadline" ] || { echo "::error::Deployment still $status after 25 minutes"; exit 1; }
              sleep 15
            done
          done

      - name: Smoke test
        env:
          APP_URL: ${{ vars.PRODUCTION_URL }}
          PORTAL_URL: ${{ vars.PRODUCTION_PORTAL_URL }}
        run: |
          set -euo pipefail
          for url in "$APP_URL/api/health" "$PORTAL_URL/api/health" "$APP_URL/sign-in"; do
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors -o /dev/null "$url"
            echo "OK $url"
          done
