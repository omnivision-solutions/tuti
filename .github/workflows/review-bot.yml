name: Review bot

# CodeRabbit reviews every PR. It only reviews PRs labeled review:coderabbit
# (.coderabbit.yaml), so this labels each one as it opens. Greptile (greptile.json)
# reviews a PR labeled review:greptile instead, added by hand, while it has credits.
#
# pull_request_target runs this file from main with a write token, so fork PRs are
# labeled too; it never checks out or runs PR code.
on:
  pull_request_target:
    # Not reopened: that would add CodeRabbit back to a PR moved to Greptile by hand.
    types: [opened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Ask CodeRabbit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=review:coderabbit" --silent
