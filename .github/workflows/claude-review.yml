name: Claude review

# Claude Code reviews every push to a pull request from this repository, beside the
# review bots, while we compare them (prompt: .github/prompts/claude-review.md).
# Findings arrive as one review from github-actions[bot]: inline comments, or all
# in the review's text when one isn't on a line of the diff.
#
# It needs secrets (.github/DEPENDENCY_UPDATES.md), so it skips pull requests from
# forks and Dependabot, which get no secrets, and from authors without write
# access: anyone can open a PR between two of this repository's branches. Claude
# runs as an unprivileged user holding only its Claude credentials, with Claude
# Code's default permissions: read-only commands, only inside the checkout. It loads no settings or hooks from the checkout, and only the PR
# author's text and replies reach its prompt: anyone can comment on a public PR.
# The GitHub token is only in the steps that read its earlier findings and post
# new ones. Actions are pinned by SHA because this workflow holds secrets.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  author:
    name: Claude review author check
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      write: ${{ steps.check.outputs.write }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # admin, write (maintainers too), read or none; a 404 for an account it doesn't know.
          if ! permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2> "$RUNNER_TEMP/error"); then
            grep -q 'HTTP 404' "$RUNNER_TEMP/error" || { cat "$RUNNER_TEMP/error" >&2; exit 1; }
            permission=none
          fi
          if [[ "$permission" == admin || "$permission" == write ]]; then
            echo "write=true" >> "$GITHUB_OUTPUT"
          else
            echo "$AUTHOR has $permission access: no Claude review." >> "$GITHUB_STEP_SUMMARY"
          fi

  review:
    name: Claude review
    needs: author
    if: needs.author.outputs.write == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # the Claude hub's network: see "Connect to the Claude hub"
    env:
      CLAUDE_MODEL: claude-opus-5-5 # the hub check asks for it too
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Prepare an unprivileged user for Claude Code
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          # Has write access (the author job).
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          npm install --global @anthropic-ai/claude-code@2.1.311
          sudo useradd --create-home --shell /bin/bash claude-reviewer
          sudo cp -a "$GITHUB_WORKSPACE" /home/claude-reviewer/tuti
          sudo chown -R claude-reviewer:claude-reviewer /home/claude-reviewer/tuti
          # The prompt's last part: this pull request, and its earlier findings with the
          # author's replies, so Claude doesn't raise them again.
          {
            printf '\n## This pull request\n\nBase %s, head %s.\n\nTitle: %s\n\nDescription:\n\n%s\n\n' "$BASE" "$HEAD" "$TITLE" "$BODY"
            echo '## Your earlier findings and the replies to them'
            echo
            gh api --paginate --slurp "repos/$REPO/pulls/$PR/comments?per_page=100" | jq --arg author "$AUTHOR" 'add // []
              | (map(select(.user.login == "github-actions[bot]" and .in_reply_to_id == null) | .id)) as $mine
              | map(select((.in_reply_to_id // .id | IN($mine[])) and ((.id | IN($mine[])) or .user.login == $author))
                | {thread: (.in_reply_to_id // .id), author: .user.login, path, line: (.line // .original_line), body})'
            # Findings that went in a review's text, and the comments quoting that review.
            texts=$(gh api --paginate --slurp "repos/$REPO/pulls/$PR/reviews?per_page=100" | jq -c 'add // []
              | map(select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- tuti-claude-review -->\n")))
                | {review: .html_url, body})')
            gh api --paginate --slurp "repos/$REPO/issues/$PR/comments?per_page=100" | jq --arg author "$AUTHOR" --argjson texts "$texts" '(add // []) as $comments
              | $texts | map(.review as $url
                | . + {replies: [$comments[] | select((.body | contains($url)) and .user.login == $author)
                  | {author: .user.login, body}]})'
          } > "$RUNNER_TEMP/pull-request.md"
      # The Claude hub pools our Claude subscriptions on a private network. The runner joins it
      # as a short-lived node that may reach only the hub, with a join key traded for GitHub's
      # token for this workflow: no network secret is stored here. When the hub doesn't answer, none
      # of its accounts has quota, or the review fails through it, the review uses
      # CLAUDE_CODE_OAUTH_TOKEN's single account.
      - name: Hide the Claude hub's address
        env:
          CLIPROXY_URL: ${{ secrets.CLIPROXY_URL }}
        run: |
          # GitHub masks the whole URL in logs; mask its host and network names too, before connecting.
          bash .github/scripts/claude-hub.sh names | sed 's/^/::add-mask::/'
      - name: Connect to the Claude hub
        id: tailnet
        continue-on-error: true
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_REVIEW_CLIENT_ID }}
          audience: ${{ secrets.TS_REVIEW_AUDIENCE }}
          tags: tag:ci
          use-cache: "false"
          log-mode: quiet
      - name: Check the Claude hub
        id: hub
        if: steps.tailnet.outcome == 'success'
        env:
          CLIPROXY_URL: ${{ secrets.CLIPROXY_URL }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
        run: |
          # Only root may talk to Tailscale, so Claude's user can't look around the network.
          # A one-token request, not a ping: the hub answers even when every account is at its limit.
          if sudo chmod 600 /var/run/tailscale/tailscaled.sock \
            && curl -sf -m 60 --retry 2 --retry-all-errors -o /dev/null "$CLIPROXY_URL/v1/messages" \
              -H "Authorization: Bearer $CLIPROXY_API_KEY" -H "anthropic-version: 2023-06-01" \
              -H "content-type: application/json" \
              -d "{\"model\": \"$CLAUDE_MODEL\", \"max_tokens\": 1, \"messages\": [{\"role\": \"user\", \"content\": \"ok\"}]}"; then
            echo "use=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The Claude hub didn't answer or has no quota; reviewing with the single account."
          fi
      - name: Review with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLIPROXY_URL: ${{ secrets.CLIPROXY_URL }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          USE_HUB: ${{ steps.hub.outputs.use }}
          SCHEMA: >-
            {"type": "object", "required": ["findings"], "properties": {"findings": {"type": "array", "items": {
              "type": "object", "required": ["path", "line", "body"], "properties": {
                "path": {"type": "string"}, "line": {"type": "integer"}, "body": {"type": "string"}}}}}}
        run: |
          set -euo pipefail
          unset ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN # only the hub run below sets them
          # Credentials go through the environment, never on a command line Claude's user could read.
          review() {
            sudo -n -H -u claude-reviewer --preserve-env=CLAUDE_CODE_OAUTH_TOKEN,ANTHROPIC_BASE_URL,ANTHROPIC_AUTH_TOKEN \
              env -C /home/claude-reviewer/tuti PATH="$PATH" \
              claude -p --model "$CLAUDE_MODEL" --no-session-persistence --output-format json \
              --setting-sources user \
              --json-schema "$SCHEMA" \
              < <(cat .github/prompts/claude-review.md "$RUNNER_TEMP/pull-request.md") > "$RUNNER_TEMP/result.json"
          }
          # The hub can answer and still fail the review (every account at its limit): then the single account.
          if [ "$USE_HUB" != true ] || ! (unset CLAUDE_CODE_OAUTH_TOKEN
            export ANTHROPIC_BASE_URL="$CLIPROXY_URL" ANTHROPIC_AUTH_TOKEN="$CLIPROXY_API_KEY"; review); then
            [ "$USE_HUB" != true ] || { tail -c 1000 "$RUNNER_TEMP/result.json"; echo
              echo "::warning::The review failed through the Claude hub; trying the single account."; }
            review || { tail -c 4000 "$RUNNER_TEMP/result.json"; exit 1; }
          fi
          jq -e '.structured_output.findings' "$RUNNER_TEMP/result.json" > "$RUNNER_TEMP/findings.json" \
            || { tail -c 4000 "$RUNNER_TEMP/result.json"; exit 1; }
          # Findings are public: never post a credential or the hub's address, whatever
          # the prompt talked Claude into.
          bash .github/scripts/claude-hub.sh check "$RUNNER_TEMP/findings.json" \
            || { echo "A finding contains a Claude credential or the hub's address; not posting." >&2; exit 1; }
      - name: Post the findings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(jq length "$RUNNER_TEMP/findings.json")
          echo "Claude found $count issue(s) on ${HEAD:0:8}." >> "$GITHUB_STEP_SUMMARY"
          (( count )) || exit 0
          # The marker alone is no finding for pr-watch's digest; the inline comments are.
          jq --arg sha "$HEAD" '{commit_id: $sha, event: "COMMENT", body: "<!-- tuti-claude-review -->",
            comments: map({path, line, side: "RIGHT", body})}' "$RUNNER_TEMP/findings.json" \
            | gh api "repos/$REPO/pulls/$PR/reviews" --input - --silent && exit 0
          # GitHub rejects the whole review if one line isn't in the diff: put them all in its text.
          jq --arg sha "$HEAD" '{commit_id: $sha, event: "COMMENT",
            body: ("<!-- tuti-claude-review -->\n" + (map("**`\(.path):\(.line)`**\n\n\(.body)") | join("\n\n---\n\n")))}' \
            "$RUNNER_TEMP/findings.json" | gh api "repos/$REPO/pulls/$PR/reviews" --input - --silent
