# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  # No "review skipped" comment on the PRs CodeRabbit sits out.
  review_status: false
  # PR descriptions already say Why / What changed / How tested.
  high_level_summary: false
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  # Nothing to review in these; skipping them keeps reviews quicker.
  path_filters:
    - "!pnpm-lock.yaml"
    - "!**/*.png"
    - "!**/*.jpg"
  pre_merge_checks:
    # We comment the why, not every function (see AGENTS.md); coverage numbers add noise.
    docstrings:
      mode: "off"
  auto_review:
    # Only PRs labeled review:coderabbit, which .github/workflows/review-bot.yml adds to
    # every PR: one taken off to try Greptile instead stays unreviewed by CodeRabbit.
    enabled: false
    labels:
      - "review:coderabbit"
    # Review every push: pr-watch waits for a review of the PR's latest commit.
    auto_pause_after_reviewed_commits: 0
    # Stacked PRs target another PR's branch, not main; review those too.
    base_branches:
      - ".*"
  path_instructions:
    - path: "apps/web/src/server/**"
      instructions: >-
        Server actions are public endpoints. Check that each one checks who is calling
        (signed in, team role) and scopes every id it receives to the caller's project,
        and that new actions are listed in authorization.db.test.ts.
    - path: "**/*.test.ts"
      instructions: >-
        Tests must be deterministic and offline: no real network calls, API keys or
        shared databases. External services use the fakes in @tuti/testkit.
    - path: "packages/db/prisma/migrations/**"
      instructions: >-
        The previous release keeps running against the new schema during a deploy. Check
        that the migration works with the code on main before this PR: no dropped, renamed,
        retyped or newly required columns or tables it still reads or writes (see AGENTS.md).
    - path: ".github/workflows/**"
      instructions: >-
        CI runs pull requests from forks: it must never need secrets, and must never
        check out or run pull request code under pull_request_target.
knowledge_base:
  code_guidelines:
    filePatterns:
      - AGENTS.md
      - docs/design.md
